<html>
  <head>
    <title>Zaroli</title>
    <style>
      /* Styles for the UI */
      body {
        font-family: Arial, sans-serif;
        text-align: center;
      }
      main {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        background-color: #f0f0f0;
      }
      .nav-btn {
        border-radius: 10px;
        padding: 1em 2em;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }
      .nav-btn.active {
        background-color: #4CAF50;
        color: white;
      }
      .nav-btn:hover {
        background-color: #3e8e41;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Header -->
      <header class="bg-slate-800 p-2 text-white">
        <h1>Zaroli</h1>
      </header>

      <!-- Navigation Menu -->
      <nav class="flex justify-center py-4">
        <button onclick="navigateTo('home')" class="nav-btn ${'home' === currentView ? 'active' : ''}">Главная</button>
        <button onclick="navigateTo('buy')" class="nav-btn ${'buy' === currentView ? 'active' : ''}">Купить</button>
        <button onclick="navigateTo('transfer')" class="nav-btn ${'transfer' === currentView ? 'active' : ''}">Перенос</button>
        <button onclick="navigateTo('keys')" class="nav-btn ${'keys' === currentView ? 'active' : ''}">Ключи</button>
        <button onclick="logout()" class="nav-btn ${'login' !== currentView ? 'hidden' : ''}">Выход</button>
      </nav>

      <!-- Content Area -->
      <section id="content-area">
        <!-- Home View -->
        <div id="view-home" class="hidden flex justify-center py-4">
          <h2>Главная страница</h2>
          <p>Здесь можно найти информацию о приложении.</p>
        </div>

        <!-- Buy View -->
        <div id="view-buy" class="hidden flex justify-center py-4">
          <form>
            <label for="buy-email">Введите Email:</label>
            <input type="email" id="buy-email" name="buy-email" />
            <button id="buy-button">Купить</button>
          </form>
        </div>

        <!-- Transfer View -->
        <div id="view-transfer" class="hidden flex justify-center py-4">
          <h2>Перенос ключа</h2>
          <p>Вам нужно ввести ключ, который вы хотите перенести.</p>
          <form>
            <label for="transfer-key-input">Введите ключ:</label>
            <input type="text" id="transfer-key-input" name="transfer-key-input" />
            <button onclick="performTransfer()">Перенос</button>
          </form>
        </div>

        <!-- Keys View -->
        <div id="view-keys" class="hidden flex justify-center py-4">
          <h2>Ваши ключи</h2>
          <p>Список ваших активных и неактивных ключей.</p>
          <ul id="keys-list"></ul>
        </div>

        <!-- Payment Modal Overlay -->
        <div id="payment-modal" class="hidden absolute inset-0 bg-black/80 backdrop-blur-sm z-50 flex justify-center items-center p-6">
          <div id="payment-modal-content" class="bg-slate-800 border border-white/10 rounded-2xl p-4 w-full max-w-sm text-center space-y-4 shadow-2xl transform scale-95 opacity-0 transition-all duration-300">
            <!-- Payment Spinner -->
            <div id="payment-spinner" class="hidden w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto"></div>

            <!-- Payment Success Icon -->
            <div id="payment-success-icon" class="hidden w-16 h-16 bg-green-500 rounded-full flex items-center justify-center mx-auto text-white">
              <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>

            <!-- Payment Title -->
            <h3 id="payment-title" class="text-lg font-bold text-white">Обработка платежа...</h3>

            <!-- Payment Description -->
            <p id="payment-desc" class="text-sm text-slate-400">Ожидайте подтверждения транзакции.</p>

            <!-- Payment Close Button -->
            <button id="payment-close-btn" onclick="closePaymentModal()" class="hidden w-full py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-medium transition-colors">
              Закрыть
            </button>
          </div>
        </div>

      </section>
    </main>

    <script>
      // --- STATE MANAGEMENT ---
      let currentView = 'home';
      let generatedKey = null;
      let userKeys = []; // Simulated DB for the user

      // --- NAVIGATION LOGIC ---
      function navigateTo(viewId) {
        // Hide all views
        const views = ['home', 'buy', 'payment-sim', 'license', 'auth', 'transfer', 'keys', 'help', 'faq', 'offer', 'privacy'];
        views.forEach(id => {
          const el = document.getElementById(`view-${id}`);
          if (el) el.classList.add('hidden');
        });

        // Show target view
        const target = document.getElementById(`view-${viewId}`);
        if (target) {
          target.classList.remove('hidden');
          void target.offsetWidth; // trigger reflow
          target.classList.add('fade-in');

          // Update Nav State
          currentView = viewId;
        }

        // Scroll to top
        document.getElementById('content-area').scrollTop = 0;
      }

      // --- BUY FLOW ---
      function goPayment() {
        const email = document.getElementById("buy-email").value;

        if (!email) {
          alert("Введите email перед покупкой");
          return;
        }

        try {
          const response = await fetch("https://functions.yandexcloud.net/d4ebwfd6b7q7467orp9", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              amount: "99.00",
              description: `Пожизненный ключ Zaroli (${email})`
            })
          });

          const data = await response.json();

          if (data.confirmation_url) {
            window.location.href = data.confirmation_url;
          } else {
            alert("Ошибка при создании платежа");
            console.log(data);
          }
        } catch (error) {
          alert("Ошибка соединения с сервером");
          console.error(error);
        }
      }

      // --- TRANSFER LOGIC ---

            console.log(data);
          }
        } catch (error) {
          alert("Ошибка соединения с сервером");
          console.error(error);
        }
      }

      // --- AUTH FLOW ---
      async function logout() {
        try {
          const response = await fetch("https://functions.yandexcloud.net/d4ebwfd6b7q7467orp9", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              amount: "99.00",
              description: `Пожизненный ключ Zaroli (${email})`
            })
          });

          const data = await response.json();

          if (data.confirmation_url) {
            window.location.href = data.confirmation_url;
          } else {
            alert("Ошибка при создании платежа");
            console.log(data);
          }
        } catch (error) {
          alert("Ошибка соединения с сервером");
          console.error(error);
        }
      }

      // --- KEYS MANAGEMENT UI ---
      function updateKeysView() {
        const guestView = document.getElementById('keys-guest-view');
        const userView = document.getElementById('keys-user-view');

        if (currentUserEmail) {
          guestView.classList.add('hidden');
          userView.classList.remove('hidden');
        } else {
          guestView.classList.remove('hidden');
          userView.classList.add('hidden');
        }
      }

      // Initialize
      document.addEventListener('DOMContentLoaded', () => {
        navigateTo('home');
      });
    </script>
</body>
</html>
