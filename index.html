<script>
// ======== NAVIGATION ========
function navigateTo(viewName) {
    // Hide all views
    document.querySelectorAll('[id^="view-"]').forEach(el => {
        el.classList.add('hidden');
    });

    // Show selected view
    const view = document.getElementById(`view-${viewName}`);
    if (view) {
        view.classList.remove('hidden');
    }

    // Update nav buttons
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    const activeBtn = document.querySelector(`[data-target="${viewName}"]`);
    if (activeBtn) {
        activeBtn.classList.add('active');
    }

    // Scroll to top
    const contentArea = document.getElementById('content-area');
    if (contentArea) {
        contentArea.scrollTop = 0;
    }
}

// ======== PAYMENT ========
async function goPayment() {
    const emailInput = document.getElementById("buy-email");
    if (!emailInput) return;
    
    const email = emailInput.value.trim();

    if (!email) {
        alert("Введите email перед покупкой");
        return;
    }

    // Validate email format
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
        alert("Введите корректный email");
        return;
    }

    try {
        const response = await fetch("https://functions.yandexcloud.net/d4ebwfd6b7q7467orp9", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                amount: "99.00",
                description: `Пожизненный ключ Zaroli (${email})`
            })
        });

        const data = await response.json();

        if (data.confirmation_url) {
            window.location.href = data.confirmation_url;
        } else {
            alert("Ошибка при создании платежа: " + (data.error || "Неизвестная ошибка"));
            console.log(data);
        }
    } catch (error) {
        alert("Ошибка соединения с сервером: " + error.message);
        console.error(error);
    }
}

// ======== AUTH ========
function sendAuthCode() {
    const emailInput = document.getElementById("auth-email");
    if (!emailInput) return;
    
    const email = emailInput.value.trim();
    if (!email) {
        alert("Введите email");
        return;
    }
    
    const step1 = document.getElementById("auth-step-1");
    const step2 = document.getElementById("auth-step-2");
    if (step1) step1.classList.add("hidden");
    if (step2) step2.classList.remove("hidden");
}

function verifyAuthCode() {
    const emailInput = document.getElementById("auth-email");
    const codeInput = document.getElementById("auth-code");
    if (!emailInput || !codeInput) return;
    
    const email = emailInput.value.trim();
    const code = codeInput.value.trim();
    
    if (!code) {
        alert("Введите код");
        return;
    }

    // Simulate successful login
    localStorage.setItem("userEmail", email);
    
    const userEmailDisplay = document.getElementById("user-email-display");
    if (userEmailDisplay) {
        userEmailDisplay.textContent = email;
    }
    
    const guestView = document.getElementById("keys-guest-view");
    const userView = document.getElementById("keys-user-view");
    const logoutBtn = document.getElementById("logout-btn");
    
    if (guestView) guestView.classList.add("hidden");
    if (userView) userView.classList.remove("hidden");
    if (logoutBtn) logoutBtn.classList.remove("hidden");
    
    const step1 = document.getElementById("auth-step-1");
    const step2 = document.getElementById("auth-step-2");
    if (step1) step1.classList.remove("hidden");
    if (step2) step2.classList.add("hidden");
    
    navigateTo("keys");
}

function resetAuth() {
    const step1 = document.getElementById("auth-step-1");
    const step2 = document.getElementById("auth-step-2");
    const emailInput = document.getElementById("auth-email");
    const codeInput = document.getElementById("auth-code");
    
    if (step1) step1.classList.remove("hidden");
    if (step2) step2.classList.add("hidden");
    if (emailInput) emailInput.value = "";
    if (codeInput) codeInput.value = "";
}

function logout() {
    localStorage.removeItem("userEmail");
    
    const guestView = document.getElementById("keys-guest-view");
    const userView = document.getElementById("keys-user-view");
    const logoutBtn = document.getElementById("logout-btn");
    
    if (guestView) guestView.classList.remove("hidden");
    if (userView) userView.classList.add("hidden");
    if (logoutBtn) logoutBtn.classList.add("hidden");
    
    navigateTo("keys");
}

// ======== TRANSFER ========
function performTransfer() {
    const keyInput = document.getElementById("transfer-key-input");
    if (!keyInput) return;
    
    const key = keyInput.value.trim();
    if (!key) {
        alert("Введите ключ");
        return;
    }
    alert(`Ключ ${key} успешно перенесен!`);
    keyInput.value = "";
}

// ======== PAGE LOAD ========
document.addEventListener('DOMContentLoaded', function() {
    // Attach buy button event
    const buyButton = document.getElementById("buy-button");
    if (buyButton) {
        buyButton.addEventListener("click", goPayment);
    }
    
    // Check if user is logged in
    const userEmail = localStorage.getItem("userEmail");
    if (userEmail) {
        const userEmailDisplay = document.getElementById("user-email-display");
        if (userEmailDisplay) {
            userEmailDisplay.textContent = userEmail;
        }
        
        const guestView = document.getElementById("keys-guest-view");
        const userView = document.getElementById("keys-user-view");
        const logoutBtn = document.getElementById("logout-btn");
        
        if (guestView) guestView.classList.add("hidden");
        if (userView) userView.classList.remove("hidden");
        if (logoutBtn) logoutBtn.classList.remove("hidden");
    }
});
</script>
